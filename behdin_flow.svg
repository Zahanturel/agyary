<svg width="900" height="1030" viewBox="0 0 900 1030" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Behdin WhatsApp booking flow</title>
<desc>How a behdin books a Machi or another service through the Agyari's WhatsApp.</desc>
<rect x="0" y="0" width="900" height="1030" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="450" y="24" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#0F172A">Behdin flow — booking on WhatsApp</text>
<rect x="280" y="40" width="340" height="64" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.2"/>
<text x="450.0" y="65.6" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#1E293B">Message the Agyari on WhatsApp</text>
<text x="450.0" y="83.52000000000001" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#52606D">QR code at the agyari, or a referral</text><rect x="650" y="40" width="210" height="64" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.2"/>
<text x="755.0" y="65.6" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#1E293B">First time only:</text>
<text x="755.0" y="83.52000000000001" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#52606D">we ask your name</text><line x1="620" y1="72" x2="650" y2="72" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3"/><path d="M450,104 L450,170" fill="none" stroke="#64748B" stroke-width="1.5"/><path d="M450,170 L250,170 L250,190" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M450,170 L650,170 L650,190" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="100" y="190" width="300" height="48" rx="10" fill="#EAF2FF" stroke="#3B6FD6" stroke-width="1.2"/>
<text x="250.0" y="214.0" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#1E293B">Book a Machi</text><line x1="250" y1="238" x2="250" y2="278" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="100" y="278" width="300" height="48" rx="10" fill="#EAF2FF" stroke="#3B6FD6" stroke-width="1.2"/>
<text x="250.0" y="302.0" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#1E293B">Pick Roj, Mah, Geh</text><line x1="250" y1="326" x2="250" y2="366" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/><polygon points="250,366 365,414 250,462 135,414" fill="#FFF7E6" stroke="#D68A00" stroke-width="1.2"/>
<text x="250" y="414" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#1E293B">Slot free?</text><path d="M250,462 L250,492" fill="none" stroke="#64748B" stroke-width="1.5"/><path d="M250,492 L170,492 L170,502" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M250,492 L330,492 L330,502" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="100" y="502" width="140" height="70" rx="10" fill="#E7F8ED" stroke="#2E9E52" stroke-width="1.2"/>
<text x="170.0" y="530.0" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#1E293B">Confirmed!</text>
<text x="170.0" y="549.6" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#52606D">Send the names</text><rect x="260" y="502" width="140" height="70" rx="10" fill="#FFF1E9" stroke="#DD6B20" stroke-width="1.2"/>
<text x="330.0" y="530.0" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#1E293B">Other options</text>
<text x="330.0" y="549.6" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#52606D">or pick again</text><rect x="500" y="190" width="300" height="48" rx="10" fill="#EAF2FF" stroke="#3B6FD6" stroke-width="1.2"/>
<text x="650.0" y="214.0" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#1E293B">See Other Services</text><line x1="650" y1="238" x2="650" y2="278" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="500" y="278" width="300" height="64" rx="10" fill="#EAF2FF" stroke="#3B6FD6" stroke-width="1.2"/>
<text x="650.0" y="303.6" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#1E293B">Pick a service</text>
<text x="650.0" y="321.52" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#52606D">Jashan, Navjote, Satum...</text><line x1="650" y1="342" x2="650" y2="382" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="500" y="382" width="300" height="48" rx="10" fill="#EAF2FF" stroke="#3B6FD6" stroke-width="1.2"/>
<text x="650.0" y="406.0" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#1E293B">Pick Roj, Mah, Time</text><line x1="650" y1="430" x2="650" y2="470" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="500" y="470" width="300" height="48" rx="10" fill="#EAF2FF" stroke="#3B6FD6" stroke-width="1.2"/>
<text x="650.0" y="494.0" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#1E293B">Send the names</text><line x1="650" y1="518" x2="650" y2="558" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="500" y="558" width="300" height="64" rx="10" fill="#EAF2FF" stroke="#3B6FD6" stroke-width="1.2"/>
<text x="650.0" y="583.6" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#1E293B">Choose who to book with</text>
<text x="650.0" y="601.52" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#52606D">shown by name, not role</text><line x1="650" y1="622" x2="650" y2="662" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="500" y="662" width="300" height="64" rx="10" fill="#EAF2FF" stroke="#3B6FD6" stroke-width="1.2"/>
<text x="650.0" y="687.6" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#1E293B">Request sent</text>
<text x="650.0" y="705.52" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#52606D">you get their number right away</text><line x1="650" y1="726" x2="650" y2="766" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/><polygon points="650,766 765,814 650,862 535,814" fill="#FFF7E6" stroke="#D68A00" stroke-width="1.2"/>
<text x="650" y="814" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#1E293B">They accept?</text><path d="M650,862 L650,892" fill="none" stroke="#64748B" stroke-width="1.5"/><path d="M650,892 L570,892 L570,902" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M650,892 L730,892 L730,902" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="500" y="902" width="140" height="70" rx="10" fill="#E7F8ED" stroke="#2E9E52" stroke-width="1.2"/>
<text x="570.0" y="930.0" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#1E293B">Confirmed!</text>
<text x="570.0" y="949.6" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#52606D">On their calendar</text><rect x="660" y="902" width="140" height="70" rx="10" fill="#FFF1E9" stroke="#DD6B20" stroke-width="1.2"/>
<text x="730.0" y="930.0" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#1E293B">You're told</text>
<text x="730.0" y="949.6" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#52606D">try again later</text><text x="250" y="170" text-anchor="middle" font-family="Arial" font-size="12" fill="#94A3B8" font-style="italic"></text>

<rect x="60" y="960" width="14" height="14" rx="3" fill="#E7F8ED" stroke="#2E9E52"/>
<text x="80" y="967" font-family="Arial" font-size="12" fill="#52606D" dominant-baseline="central">Booked</text>
<rect x="180" y="960" width="14" height="14" rx="3" fill="#FFF1E9" stroke="#DD6B20"/>
<text x="200" y="967" font-family="Arial" font-size="12" fill="#52606D" dominant-baseline="central">Needs another step</text>
<rect x="420" y="960" width="14" height="14" rx="3" fill="#FFF7E6" stroke="#D68A00"/>
<text x="440" y="967" font-family="Arial" font-size="12" fill="#52606D" dominant-baseline="central">System checks something</text>

</svg>