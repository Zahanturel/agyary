services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agyary}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agyary}
      POSTGRES_DB: ${POSTGRES_DB:-agyary}
    ports:
      - "5432:5432"
    volumes:
      - agyary_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agyary} -d ${POSTGRES_DB:-agyary}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Always the in-network DSN; must not inherit a localhost DSN from .env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-agyary}:${POSTGRES_PASSWORD:-agyary}@db:5432/${POSTGRES_DB:-agyary}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./src:/app/src

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      app:
        condition: service_started

volumes:
  agyary_pgdata:
