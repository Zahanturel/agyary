<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#232A4D">
<title>Mobed Diary</title>
<link rel="manifest" href="/mobed-manifest.json">
<link rel="preload" href="/mobed-fonts/figtree.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/mobed-app/app.css">
</head>
<body>

<header>
  <button id="backBtn" class="icon-btn hidden" title="Back" aria-label="Back">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M15 5l-7 7 7 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
  <h1 id="headerTitle">Mobed Diary</h1>
  <div class="right">
    <!-- The menu is an icon, not a word. It is the only thing in the header
         besides the title - there is no tab bar; the calendar IS the app. -->
    <button id="bellBtn" class="icon-btn hidden" title="Notifications" aria-label="Notifications">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15L6 16zM10 21h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span id="bellBadge" class="bell-badge hidden"></span>
    </button>
    <button id="menuBtn" class="icon-btn hidden" title="Menu" aria-label="Menu">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
</header>

<main id="main"></main>

<!-- The three places a mobed lives: their machi board, their calendar and
     their behdins. Shown on every screen except Settings, sign-in and
     onboarding; the tab they came from stays lit on a form or a slip. -->
<nav id="tabs" class="tabs hidden" aria-label="Main">
  <button data-tab="machi" aria-label="Machi">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M12 2.8c.5 3.2 4.7 5.2 4.7 9.6a4.7 4.7 0 0 1-9.4 0c0-1.9.9-3.3 2-4.3.2 1.2.9 2 1.8 2.3C10.9 8.1 11.4 5.5 12 2.8z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      <path d="M5.5 21h13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg><span>Machi</span>
  </button>
  <button data-tab="calendar" aria-label="Calendar">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <rect x="3.5" y="5" width="17" height="15" rx="2.5" stroke="currentColor" stroke-width="2"/>
      <path d="M3.5 10h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg><span>Calendar</span>
  </button>
  <button data-tab="behdins" aria-label="Behdins">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <circle cx="9" cy="8" r="3.5" stroke="currentColor" stroke-width="2"/>
      <path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path d="M16 4.7a3.5 3.5 0 0 1 0 6.6M18 14.4c2.2.7 3.5 2.6 3.5 5.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg><span>Behdins</span>
  </button>
</nav>

<button id="fab" class="fab hidden" title="Add an event" aria-label="Add an event">+</button>

<script type="module" src="/mobed-app/js/main.js"></script>
</body>
</html>
