<svg width="900" height="1030" viewBox="0 0 900 1030" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Priest (mobed) app flow</title>
<desc>How a priest onboards to the app and manages their calendar and the shared Machi board.</desc>
<rect x="0" y="0" width="900" height="1030" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="450" y="24" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#0F172A">Priest (mobed) flow — the app</text>
<rect x="280" y="40" width="340" height="64" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.2"/>
<text x="450.0" y="65.6" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#1E293B">Open the app</text>
<text x="450.0" y="83.52000000000001" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#52606D">no install — just a link</text><line x1="450" y1="104" x2="450" y2="144" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="280" y="144" width="340" height="48" rx="10" fill="#EAF2FF" stroke="#3B6FD6" stroke-width="1.2"/>
<text x="450.0" y="168.0" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#1E293B">Enter your name &amp; phone number</text><line x1="450" y1="192" x2="450" y2="232" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="280" y="232" width="340" height="48" rx="10" fill="#EAF2FF" stroke="#3B6FD6" stroke-width="1.2"/>
<text x="450.0" y="256.0" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#1E293B">Verify with a WhatsApp code</text><line x1="450" y1="280" x2="450" y2="320" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="280" y="320" width="340" height="64" rx="10" fill="#EAF2FF" stroke="#3B6FD6" stroke-width="1.2"/>
<text x="450.0" y="345.6" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#1E293B">Search &amp; select your Agyari</text>
<text x="450.0" y="363.52" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#52606D">you can add more, anytime</text><line x1="450" y1="384" x2="450" y2="424" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="280" y="424" width="340" height="70" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
<text x="450.0" y="452.0" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#1E293B">My Day — your home screen</text>
<text x="450.0" y="471.6" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#52606D">today's events, in time order</text><rect x="650" y="412" width="220" height="64" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.2"/>
<text x="760.0" y="437.6" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#1E293B">Machi Board</text>
<text x="760.0" y="455.52" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#52606D">seen by every priest here</text><path d="M620,459 L650,444" fill="none" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3"/><path d="M450,494 L450,524" fill="none" stroke="#64748B" stroke-width="1.5"/><path d="M450,524 L250,524 L250,534" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M450,524 L650,524 L650,534" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="100" y="534" width="300" height="64" rx="10" fill="#EAF2FF" stroke="#3B6FD6" stroke-width="1.2"/>
<text x="250.0" y="559.6" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#1E293B">Add it yourself</text>
<text x="250.0" y="577.52" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#52606D">walk-ins, phone bookings</text><line x1="250" y1="598" x2="250" y2="638" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="100" y="638" width="300" height="64" rx="10" fill="#EAF2FF" stroke="#3B6FD6" stroke-width="1.2"/>
<text x="250.0" y="663.6" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#1E293B">Fill in the details</text>
<text x="250.0" y="681.52" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#52606D">event, behdin, roj/mah/time, names</text><line x1="250" y1="702" x2="250" y2="742" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="100" y="742" width="300" height="48" rx="10" fill="#E7F8ED" stroke="#2E9E52" stroke-width="1.2"/>
<text x="250.0" y="766.0" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#1E293B">Added to My Day</text><rect x="500" y="534" width="300" height="64" rx="10" fill="#EAF2FF" stroke="#3B6FD6" stroke-width="1.2"/>
<text x="650.0" y="559.6" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#1E293B">A behdin requests you</text>
<text x="650.0" y="577.52" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#52606D">sent from WhatsApp</text><line x1="650" y1="598" x2="650" y2="638" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="500" y="638" width="300" height="48" rx="10" fill="#EAF2FF" stroke="#3B6FD6" stroke-width="1.2"/>
<text x="650.0" y="662.0" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#1E293B">You're notified on WhatsApp</text><line x1="650" y1="686" x2="650" y2="726" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/><polygon points="650,726 765,774 650,822 535,774" fill="#FFF7E6" stroke="#D68A00" stroke-width="1.2"/>
<text x="650" y="774" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="600" fill="#1E293B">Accept?</text><path d="M650,822 L650,852" fill="none" stroke="#64748B" stroke-width="1.5"/><path d="M650,852 L570,852 L570,862" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M650,852 L730,852 L730,862" fill="none" stroke="#64748B" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="500" y="862" width="140" height="64" rx="10" fill="#E7F8ED" stroke="#2E9E52" stroke-width="1.2"/>
<text x="570.0" y="894.0" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#1E293B">Added</text><rect x="660" y="862" width="140" height="64" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.2"/>
<text x="730.0" y="894.0" text-anchor="middle" dominant-baseline="central" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" fill="#1E293B">Nothing added</text>

<rect x="60" y="990" width="14" height="14" rx="3" fill="#E7F8ED" stroke="#2E9E52"/>
<text x="80" y="997" font-family="Arial" font-size="12" fill="#52606D" dominant-baseline="central">On the calendar</text>
<rect x="220" y="990" width="14" height="14" rx="3" fill="#EDE9FE" stroke="#7C3AED"/>
<text x="240" y="997" font-family="Arial" font-size="12" fill="#52606D" dominant-baseline="central">Home screen</text>
<rect x="380" y="990" width="14" height="14" rx="3" fill="#FFF7E6" stroke="#D68A00"/>
<text x="400" y="997" font-family="Arial" font-size="12" fill="#52606D" dominant-baseline="central">Decision</text>

</svg>